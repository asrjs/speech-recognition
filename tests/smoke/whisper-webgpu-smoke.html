<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whisper Splitgraph — fp16 WebGPU Smoke</title>
<style>
body { font-family: monospace; background: #111; color: #eee; padding: 20px; max-width: 960px; margin: auto; }
h1 { color: #0cf; }
pre { background: #222; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
button { padding: 8px 16px; font: inherit; cursor: pointer; }
select { padding: 6px 10px; font: inherit; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; }
.status { padding: 4px 0; }
.pass { color: #0f0; }
.fail { color: #f44; }
.warn { color: #fa0; }
.info { color: #0cf; }
.config-row { margin: 8px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.config-row label { color: #aaa; font-size: 13px; }
</style>
</head>
<body>
<h1>Whisper Splitgraph &mdash; fp16 WebGPU Smoke</h1>

<div class="config-row">
  <label>Model:</label>
  <select id="modelSelect" onchange="onModelChange()">
    <option value="whisper-base">whisper-base fp16 (80 mel, ~380MB)</option>
    <option value="whisper-large-v3-turbo">whisper-large-v3-turbo fp16 (128 mel, ~2.3GB)</option>
  </select>
  <label>Backend: <span id="backendLabel">detecting...</span></label>
</div>

<p>
  <b>Fixture</b>: jfk2.en.wav ("And so my fellow Americans...")<br>
  <b>Model dir</b>: <span id="modelDir"></span><br>
  <b>Mel bins</b>: <span id="melBinsLabel"></span>
</p>

<button id="runBtn" onclick="runSmoke()">Run fp16 WebGPU Smoke</button>
<span id="status" class="status"></span>

<pre id="log" style="display:none;"></pre>
<pre id="result" style="display:none;"></pre>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.all.min.js"></script>
<script>
// ── Model configurations ──
const MODELS = {
  'whisper-base': {
    name: 'whisper-base',
    dir: '/tests/smoke/.whisper-fp16-model/',
    nMels: 80,
    melFrames: 3000,
    promptIds: [50258, 50259, 50359, 50363], // <|startoftranscript|>, <|en|>, <|transcribe|>, <|notimestamps|>
    eosId: 50257,
    maxNewTokens: 64,
    // Reference from Node/WASM V2 validator (whisper-base fp32)
    refTokens: [400, 370, 452, 7177, 6280, 11, 1029, 406, 437, 428, 1941, 393, 360, 337, 291, 11, 1029, 437, 291, 393, 360, 337, 428, 1941, 13, 50257],
    refText: "And so my fellow Americans, ask not what your country can do for you, ask what you can do for your country.",
  },
  'whisper-large-v3-turbo': {
    name: 'whisper-large-v3-turbo',
    dir: '/models/whisper-large-v3-turbo-fp16/',  // serve this dir via HTTP
    nMels: 128,
    melFrames: 3000,
    promptIds: [50258, 50259, 50359],  // <|startoftranscript|>, <|en|>, <|transcribe|>
    eosId: 50257,
    maxNewTokens: 200,
    // Reference from native ORT fp32 smoke (large-v3-turbo)
    refTokens: [],  // populated from native ORT run
    refText: "And so, my fellow Americans, ask not what your country can do for you, ask what you can do for your country.",
  }
};

let currentModel = MODELS['whisper-base'];

function onModelChange() {
  currentModel = MODELS[document.getElementById('modelSelect').value];
  document.getElementById('modelDir').textContent = currentModel.dir;
  document.getElementById('melBinsLabel').textContent = currentModel.nMels;
}

// Init display
onModelChange();

// ── Check WebGPU ──
const isWebGpu = typeof navigator !== 'undefined' && navigator.gpu;
const ep = isWebGpu ? 'webgpu' : 'wasm';
document.getElementById('backendLabel').textContent = isWebGpu ? 'WebGPU' : 'WASM (fallback)';
document.getElementById('backendLabel').className = isWebGpu ? 'pass' : 'warn';

// ── Log helper ──
const logEl = document.getElementById('log');
const resultEl = document.getElementById('result');
const statusEl = document.getElementById('status');
function log(msg) { logEl.style.display='block'; logEl.textContent += msg + '\n'; }
function status(msg, cls) { statusEl.textContent = msg; statusEl.className = 'status ' + (cls||''); }

// ── Minimal Whisper mel processor (hand-rolled, use pre-computed mel when available) ──
function computeMel(pcm, sampleRate, nMels) {
  const hopLength = 160, winLength = 400, fftSize = 512;
  const nFrames = Math.floor((pcm.length - winLength) / hopLength) + 1;
  const nFreqs = fftSize / 2 + 1;

  const window = new Float32Array(winLength);
  for (let i = 0; i < winLength; i++) window[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (winLength - 1)));

  const magnitudes = new Float32Array(nFrames * nFreqs);
  for (let f = 0; f < nFrames; f++) {
    const offset = f * hopLength;
    const real = new Float32Array(fftSize), imag = new Float32Array(fftSize);
    for (let n = 0; n < winLength; n++) {
      const sample = (pcm[offset + n] ?? 0) * (window[n] ?? 0);
      for (let k = 0; k < nFreqs; k++) {
        const angle = -2 * Math.PI * k * n / fftSize;
        real[k] += sample * Math.cos(angle);
        imag[k] += sample * Math.sin(angle);
      }
    }
    for (let k = 0; k < nFreqs; k++) {
      magnitudes[f * nFreqs + k] = Math.sqrt(real[k] * real[k] + imag[k] * imag[k]);
    }
  }

  function hzToMel(hz) { return 2595 * Math.log10(1 + hz / 700); }
  function melToHz(mel) { return 700 * (10 ** (mel / 2595) - 1); }
  const melMin = hzToMel(0), melMax = hzToMel(sampleRate / 2);
  const melPoints = new Float32Array(nMels + 2);
  for (let i = 0; i < nMels + 2; i++) melPoints[i] = melToHz(melMin + (melMax - melMin) * i / (nMels + 1));

  const melBank = new Float32Array(nFreqs * nMels);
  for (let m = 0; m < nMels; m++) {
    const left = melPoints[m], center = melPoints[m + 1], right = melPoints[m + 2];
    for (let k = 0; k < nFreqs; k++) {
      const freq = k * sampleRate / fftSize;
      if (freq < left || freq > right) continue;
      melBank[m * nFreqs + k] = freq <= center ? (freq - left) / (center - left) : (right - freq) / (right - center);
    }
  }

  const melSpec = new Float32Array(nMels * nFrames);
  for (let f = 0; f < nFrames; f++) {
    for (let m = 0; m < nMels; m++) {
      let sum = 0;
      for (let k = 0; k < nFreqs; k++) sum += magnitudes[f * nFreqs + k] * (melBank[m * nFreqs + k] ?? 0);
      melSpec[m * nFrames + f] = Math.max(Math.log(Math.max(sum, 1e-10)), -10);
    }
  }

  const melFrames = currentModel.melFrames;
  const out = new Float32Array(nMels * melFrames);
  const copyFrames = Math.min(nFrames, melFrames);
  for (let m = 0; m < nMels; m++) {
    for (let f = 0; f < copyFrames; f++) out[m * melFrames + f] = melSpec[m * nFrames + f] ?? 0;
  }
  return out;
}

// ── Argmax ──
function argmax(arr) {
  let idx = 0, val = arr[0] ?? -Infinity;
  for (let i = 1; i < arr.length; i++) { if ((arr[i] ?? -Infinity) > val) { idx = i; val = arr[i]; } }
  return idx;
}

// ── float16 ↔ float32 (IEEE 754) ──
function float32ToFloat16Bits(values) {
  const out = new Uint16Array(values.length);
  const f32 = new Float32Array(1), u32 = new Uint32Array(f32.buffer);
  for (let i = 0; i < values.length; i++) {
    f32[0] = values[i] ?? 0;
    const x = u32[0], sign = (x >>> 16) & 0x8000;
    let mantissa = x & 0x7fffff, exp = (x >>> 23) & 0xff;
    if (exp === 0xff) { out[i] = sign | (mantissa ? 0x7e00 : 0x7c00); }
    else if (exp > 142) { out[i] = sign | 0x7c00; }
    else if (exp < 113) {
      if (exp < 103) out[i] = sign;
      else { mantissa |= 0x800000; const shift = 125 - exp; out[i] = sign | ((mantissa + (1 << (shift - 1))) >> shift); }
    } else { exp = exp - 112; mantissa = mantissa + 0x1000; if (mantissa & 0x800000) { mantissa = 0; exp++; } out[i] = sign | (exp << 10) | (mantissa >> 13); }
  }
  return out;
}

function float16BitsToFloat32(values) {
  const out = new Float32Array(values.length);
  for (let i = 0; i < values.length; i++) {
    const h = values[i] ?? 0;
    const sign = (h & 0x8000) ? -1 : 1;
    const exp = (h >>> 10) & 0x1f, frac = h & 0x03ff;
    if (exp === 0) out[i] = frac === 0 ? sign * 0 : sign * 2 ** -14 * (frac / 1024);
    else if (exp === 0x1f) out[i] = frac === 0 ? sign * Infinity : NaN;
    else out[i] = sign * 2 ** (exp - 15) * (1 + frac / 1024);
  }
  return out;
}

function ensureFloat32(data, type) {
  return type === 'float16' ? float16BitsToFloat32(data) : data;
}

// ── Tokenizer ──
let tokenizer = null;
async function loadTokenizer(modelDir) {
  const resp = await fetch(modelDir + 'tokenizer.json');
  tokenizer = await resp.json();
}

function decodeText(ids) {
  if (!tokenizer) return `[${ids.join(',')}]`;
  const vocab = tokenizer.model?.vocab ?? tokenizer.vocab ?? {};
  const idToToken = {};
  for (const [tok, id] of Object.entries(vocab)) idToToken[id] = tok;
  let text = '';
  for (const id of ids) {
    const tok = idToToken[id] ?? '';
    if (id >= 50257) continue;
    text += tok.replace(/^Ġ/, ' ').replace(/^Ċ/, '\n');
  }
  return text.trim();
}

// ── Main smoke ──
async function runSmoke() {
  const model = currentModel;
  logEl.textContent = '';
  resultEl.style.display = 'none';
  status('Loading...', 'info');

  try {
    log(`Model: ${model.name} (${model.nMels} mel bins)`);
    log(`Backend: ${ep}`);
    log(`Model dir: ${model.dir}`);

    // 1. Load mel features
    let mel;
    log('Loading mel features...');
    const melUrl = `/tests/smoke/jfk2-mel${model.nMels === 128 ? '-128' : ''}.json`;
    const melResp = await fetch(melUrl);
    if (!melResp.ok) {
      log(`  Pre-computed mel not found (${melUrl}), computing from audio...`);
      const audioCtx = new AudioContext({ sampleRate: 16000 });
      const audioResp = await fetch('/tests/fixtures/jfk2.en.wav');
      const audioBuf = await audioResp.arrayBuffer();
      const decoded = await audioCtx.decodeAudioData(audioBuf);
      const pcm16k = decoded.getChannelData(0);
      mel = computeMel(pcm16k, 16000, model.nMels);
      log('  Mel computed from audio (hand-rolled DFT)');
    } else {
      mel = new Float32Array(await melResp.json());
      log(`  Pre-computed mel loaded (${model.nMels} bins)`);
    }
    log(`  Mel shape: [1, ${model.nMels}, ${model.melFrames}]`);

    // 2. Load ONNX sessions (browser needs explicit externalData mapping)
    log('Creating ONNX sessions...');
    const tSessStart = performance.now();

    // Helper: fetch external data file if it exists, return session options
    async function createSession(graphFile, dataFile) {
      const sessOpts = { executionProviders: [ep], graphOptimizationLevel: 'all' };
      if (dataFile) {
        const dataUrl = model.dir + dataFile;
        log(`  fetching external data: ${dataFile}`);
        const dataResp = await fetch(dataUrl);
        if (dataResp.ok) {
          const dataBuf = await dataResp.arrayBuffer();
          sessOpts.externalData = [{ path: dataFile, data: new Uint8Array(dataBuf) }];
          log(`    loaded (${(dataBuf.byteLength / 1024 / 1024).toFixed(1)} MB)`);
        } else {
          log(`  WARN: external data not found (${dataUrl}), trying without`);
        }
      }
      return ort.InferenceSession.create(model.dir + graphFile, sessOpts);
    }

    const encSess = await createSession('encoder_model.onnx', 'encoder_model.onnx.data');
    log(`  encoder loaded`);
    const initSess = await createSession('decoder_init.onnx', 'decoder_init.onnx.data');
    log(`  decoder_init loaded`);
    const stepSess = await createSession('decoder_step.onnx', 'decoder_step.onnx.data');
    log(`  decoder_step loaded`);
    log(`  Sessions created in ${((performance.now() - tSessStart) / 1000).toFixed(2)}s`);

    // 3. Encoder (fp16 input)
    log('Running encoder (fp16 input)...');
    const melFp16 = float32ToFloat16Bits(mel);
    const melTensor = new ort.Tensor('float16', melFp16, [1, model.nMels, model.melFrames]);
    const tEnc = performance.now();
    const encOut = await encSess.run({ input_features: melTensor });
    const encData = encOut[Object.keys(encOut)[0]];
    log(`  Encoder: [${encData.dims.join(', ')}], ${((performance.now() - tEnc) / 1000).toFixed(2)}s`);

    // 4. Decoder init
    log('Running decoder_init...');
    const inputIds = new BigInt64Array(model.promptIds.map(BigInt));
    const promptTensor = new ort.Tensor('int64', inputIds, [1, model.promptIds.length]);
    const tInit = performance.now();
    const initOut = await initSess.run({ input_ids: promptTensor, encoder_hidden_states: encData });
    const initKeys = Object.keys(initOut);
    const logitsKey = initKeys.find(k => k.includes('logits')) ?? initKeys[0];
    const initLogitsTensor = initOut[logitsKey];
    const vocabSize = initLogitsTensor.dims.at(-1);
    const initLogits = ensureFloat32(initLogitsTensor.data, initLogitsTensor.type);
    const firstLogits = initLogits.subarray(initLogits.length - vocabSize);
    let nextToken = argmax(firstLogits);
    const tokens = [nextToken];
    log(`  Init token: ${nextToken}, ${((performance.now() - tInit) / 1000).toFixed(2)}s`);

    // Build pastKv (present.* → past_key_values.*)
    const pastKv = {};
    for (const key of initKeys) {
      if (key.startsWith('present')) pastKv[key.replace(/^present\./, 'past_key_values.')] = initOut[key];
    }

    // 5. Step loop
    log(`Step loop (max ${model.maxNewTokens} tokens)...`);
    let eosReached = nextToken === model.eosId;
    const tLoop = performance.now();
    for (let step = 1; step < model.maxNewTokens && !eosReached; step++) {
      const feeds = { input_ids: new ort.Tensor('int64', new BigInt64Array([BigInt(nextToken)]), [1, 1]) };
      for (const [k, v] of Object.entries(pastKv)) feeds[k] = v;

      const stepOut = await stepSess.run(feeds);
      const stepKeys = Object.keys(stepOut);
      const stepLogitsKey = stepKeys.find(k => k.includes('logits')) ?? stepKeys[0];
      const stepLogits = ensureFloat32(stepOut[stepLogitsKey].data, stepOut[stepLogitsKey].type);
      nextToken = argmax(stepLogits);
      tokens.push(nextToken);
      eosReached = nextToken === model.eosId;

      for (const key of stepKeys) {
        if (key.startsWith('present')) {
          pastKv[key.replace(/^present\./, 'past_key_values.')] = stepOut[key];
        }
      }
    }
    log(`  Loop: ${tokens.length} tokens, ${((performance.now() - tLoop) / 1000).toFixed(2)}s`);

    // 6. Decode text
    await loadTokenizer(model.dir);
    const decodedText = decodeText(tokens);

    // 7. Compare against reference (if available)
    resultEl.style.display = 'block';
    const lines = [
      `WEB  tokens: [${tokens.join(', ')}]`,
      `WEB  text:   "${decodedText.trim()}"`,
      '',
    ];

    if (model.refTokens.length > 0) {
      lines.push(`REF  tokens: [${model.refTokens.join(', ')}]`);
      lines.push(`REF  text:   "${model.refText}"`);
      lines.push('');
      const refExact = tokens.length === model.refTokens.length && tokens.every((t, i) => t === model.refTokens[i]);
      const refTextMatch = decodedText.trim().toLowerCase() === model.refText.trim().toLowerCase();
      let firstMismatch = -1;
      for (let i = 0; i < Math.min(tokens.length, model.refTokens.length); i++) {
        if (tokens[i] !== model.refTokens[i]) { firstMismatch = i; break; }
      }
      lines.push(`Token match: ${refExact ? 'PASS (exact)' : 'DIFF (first mismatch at index ' + firstMismatch + ')'}`);
      lines.push(`Text  match: ${refTextMatch ? 'PASS' : 'FAIL'}`);
      if (refExact && refTextMatch) {
        status(`PASS — ${model.name} fp16 matches reference`, 'pass');
      } else {
        status(`DIFF — see comparison above`, 'warn');
      }
    } else {
      lines.push('(No reference tokens for this model — validate manually)');
      const hasEos = tokens[tokens.length - 1] === model.eosId;
      lines.push(`EOS: ${hasEos ? 'PASS' : 'MISSING'}`);
      lines.push(`Tokens: ${tokens.length}`);
      status(hasEos ? `PASS — ${tokens.length} tokens, ends with EOS` : 'WARN — missing EOS', hasEos ? 'pass' : 'warn');
    }

    resultEl.textContent = lines.join('\n');

  } catch (err) {
    log(`\nERROR: ${err.message}\n${err.stack}`);
    status('FAILED — check log for details', 'fail');
  }
}
</script>
</body>
</html>

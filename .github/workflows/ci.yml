name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        # The pinned onnxruntime-node dev build resolves binaries from the
        # ORT nightly NuGet feed, which has already expired that build.
        # Library code only path-resolves the package (require.resolve), and
        # the one native-bound test suite imports it lazily behind artifact
        # gates, so CI skips the native download.
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Node import smoke
        run: npm run test:node-smoke
      - name: Package tarball smoke
        run: node tests/smoke/package-tarball-smoke.mjs
      - name: Browser root import graph
        run: node tests/smoke/browser-root-import-graph.mjs
